[project]
name = "fitshed"
version = "0.5.0"
description = "FitShed: розклад і онлайн-запис для фітнес-центру"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6", "jsonschema>=4.18"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
