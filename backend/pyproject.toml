[project]
name = "fitshed"
version = "0.6.0"
description = "FitShed: розклад і онлайн-запис для фітнес-центру"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
     "requests>=2.31",
      "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6", "jsonschema>=4.18"]
messaging = ["pika>=1.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
